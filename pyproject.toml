[project]
name = "vote-transfer"
version = "0.1.0"
description = "Reproducible analysis of second-round vote transfers in French presidential elections"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pandas>=2.3.0,<3",
    "pyarrow>=21.0.0,<22",
    "requests>=2.32.0,<3",
    "streamlit>=1.50.0,<2",
]

[project.scripts]
vote-transfer = "vote_transfer.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.4.0,<9",
    "ruff>=0.13.0,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/vote_transfer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["backend"]

[tool.ruff]
extend-exclude = ["tmp", "data"]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
